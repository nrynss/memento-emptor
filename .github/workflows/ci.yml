name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            merchant/package-lock.json

      # The gate's shopper-page typecheck is `bun run typecheck` over
      # agent/frontend/server, and both agents' offline checks run under bun.
      # Each needs bun plus that package's modules; without them the gate
      # prints which check it skipped. The version matches the one the gate was
      # proved on; the cache holds bun's package downloads, keyed by the three
      # frozen lockfiles.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('agent/frontend/bun.lock', 'agent/runtime/bun.lock', 'agent/second/bun.lock') }}

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install merchant dependencies
        run: npm ci
        working-directory: merchant

      - name: Install shopper frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: agent/frontend

      - name: Install reference agent dependencies
        run: bun install --frozen-lockfile
        working-directory: agent/runtime

      - name: Install second agent dependencies
        run: bun install --frozen-lockfile
        working-directory: agent/second

      - name: Run the gate
        run: ./tools/check.sh
