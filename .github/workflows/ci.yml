name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            merchant/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install merchant dependencies
        run: npm ci
        working-directory: merchant

      - name: Run the gate
        run: ./tools/check.sh
