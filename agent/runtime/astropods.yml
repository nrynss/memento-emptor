# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: blueprint/v1
name: memento-agent

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    messaging: true

models:
  # Astro AI Gateway — managed model access (injects ASTRO_GATEWAY_URL +
  # ASTRO_GATEWAY_API_KEY at deploy). The deploy-time pick is injected as
  # MODEL_DEFAULT. T3.1 decision: claude-sonnet-4-6, used in all three
  # comparison arms, so per-turn cost is comparable across arms.
  default:
    provider: gateway
    models: [claude-sonnet-4-6]

dev:
  interfaces:
    messaging:
      adapters: [web]
