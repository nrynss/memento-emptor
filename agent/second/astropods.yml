# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: blueprint/v1
name: memento-second

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    messaging: true
  # The served layer's edge. The key is a secret input: it never appears in
  # this file or the image and reaches the container from the platform's
  # secret store at deploy time.
  inputs:
    - name: MEMENTO_AGENT_KEY
      datatype: string
      secret: true
      description: Agent key the Memento layer's edge authenticates.
    - name: MEMENTO_LAYER_URL
      datatype: string
      description: Base URL of the layer's edge.
      default: https://memento-emptor.onrender.com

models:
  # Astro AI Gateway — managed model access (injects ASTRO_GATEWAY_URL +
  # ASTRO_GATEWAY_API_KEY at deploy). The deploy-time pick arrives as
  # MODEL_DEFAULT. Same model as the reference agent so a turn costs the
  # same on either deployment and the pair stays comparable.
  default:
    provider: gateway
    models: [claude-sonnet-4-6]

dev:
  interfaces:
    messaging:
      adapters: [web]
